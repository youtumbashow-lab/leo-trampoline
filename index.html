<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Львёнок на батуте</title>
<style>
  html,body{
    margin:0;height:100%;background:#87CEEB;overflow:hidden;
    font-family:'Comic Sans MS','Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #wrap{
    position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#87CEEB;
  }
  canvas{
    display:block;background:linear-gradient(#87CEEB 0%,#FFE4B5 100%);
    max-width:100%;max-height:100%;
    touch-action:none;
  }
  #hud{
    position:absolute;top:0;left:0;right:0;padding:8px 14px;
    color:#fff;text-shadow:2px 2px 0 #000,0 0 8px #000;
    font-size:20px;pointer-events:none;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  #hudLeft{font-size:18px;line-height:1.4;}
  #task{
    font-size:22px;font-weight:bold;text-align:right;line-height:1.4;
    flex:1;
  }
  #combo{
    position:absolute;top:150px;left:50%;transform:translateX(-50%);
    font-size:26px;font-weight:bold;color:#ffeb3b;
    text-shadow:2px 2px 0 #000;pointer-events:none;z-index:6;
    opacity:0;transition:opacity .2s;
  }
  #combo.show{opacity:1;}
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.75);color:#fff;font-size:26px;text-align:center;
    flex-direction:column;cursor:pointer;z-index:10;padding:20px;
  }
  #overlay.hidden{display:none;}
  #msg{max-width:90%;line-height:1.4;white-space:pre-line;text-shadow:2px 2px 0 #000;}
  #hint{font-size:16px;margin-top:24px;opacity:.85;}
  .btn{
    margin-top:16px;padding:10px 24px;font-size:16px;
    background:#3498db;color:#fff;border:2px solid #fff;border-radius:8px;
    cursor:pointer;font-family:inherit;
  }
  .btn:hover{background:#2980b9;}
  .btn.red{background:#e74c3c;}
  .btn.red:hover{background:#c0392b;}
  .flash{
    position:absolute;top:120px;left:50%;transform:translateX(-50%);
    font-size:38px;color:#fff;text-shadow:3px 3px 0 #000;
    pointer-events:none;z-index:8;font-weight:bold;
    animation:pop 0.7s ease-out forwards;
  }
  @keyframes pop{
    0%{opacity:0;transform:translateX(-50%) scale(.6);}
    20%{opacity:1;transform:translateX(-50%) scale(1.15);}
    100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-50px);}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="hud">
    <div id="hudLeft">❤️ <span id="lives">3</span><br>⏱ <span id="time">60</span>с<br>Задание <span id="taskNum">1</span></div>
    <div id="task">Задание: —</div>
  </div>
  <div id="combo"></div>
  <div id="overlay">
    <div id="msg">🦁 Львёнок на батуте!</div>
    <div id="hint">Нажми, чтобы начать</div>
    <button class="btn red" id="resetBtn" style="display:none">Сбросить рекорд</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ==================== КОНСТАНТЫ ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const GRAVITY = 1600;
const JUMP_HEIGHT = H * (2/3);
const JUMP_POWER = -Math.sqrt(2 * GRAVITY * JUMP_HEIGHT);

// --- Балансировка длинной сессии ---
const START_TIME       = 60;
const TIME_BONUS_BASE  = 12;
const TIME_BONUS_COMBO = 2;
const TIME_PENALTY     = 1;
const TIME_CLOCK_BONUS = 6;
const MAX_TIME         = 180;
const BASE_TIME_SCALE  = 0.85;
const LOW_LIFE_SCALE   = 0.6;
const PAUSE_BETWEEN    = 0.6;

// --- Жизни и передышки ---
const MAX_LIVES           = 5;
const LIFE_REGEN_EVERY    = 8;    // +1 жизнь каждые N заданий
const BREATHER_EVERY      = 5;    // каждые N заданий — передышка
const BREATHER_DURATION   = 12;   // сек передышки
const BREATHER_LOOSEN     = 1.5;  // во сколько раз проще в передышке

const TYPES = {
  red:    {emoji:'🔴', name:'красный шарик'},
  blue:   {emoji:'🔵', name:'синий шарик'},
  green:  {emoji:'🟢', name:'зелёный шарик'},
  cake:   {emoji:'🍰', name:'тортик'},
  star:   {emoji:'⭐', name:'звезда'},
  apple:  {emoji:'🍎', name:'яблоко'},
  bomb:   {emoji:'💣', name:'бомба'},
  clock:  {emoji:'⏰', name:'часы'}
};

// ==================== ЗАДАНИЯ ====================
// Сложность растёт медленно: используем sqrt для плавности
function makeTask(num){
  const templates = [
    [{type:'red', n:3}],
    [{type:'red', n:2},{type:'cake', n:1}],
    [{type:'star', n:3}],
    [{type:'blue', n:2},{type:'apple', n:1}],
    [{type:'red', n:2},{type:'blue', n:2},{type:'star', n:1}],
    [{type:'cake', n:2},{type:'star', n:2},{type:'apple', n:2}],
    [{type:'green', n:3},{type:'cake', n:1}],
    [{type:'red', n:3},{type:'blue', n:2},{type:'apple', n:1}],
    [{type:'star', n:4},{type:'cake', n:2}],
    [{type:'green', n:2},{type:'red', n:2},{type:'blue', n:2},{type:'star', n:1}]
  ];
  const cycle = Math.floor((num - 1) / templates.length);
  const tmpl = templates[(num - 1) % templates.length];

  // Рост количества только каждые 3 цикла (медленнее)
  const extra = Math.floor(cycle / 3);

  return tmpl.map((t, i) => ({
    type: t.type,
    n: t.n + (extra > 0 && i === 0 ? extra : 0)
  }));
}

// Плавный рост сложности от номера задания
function taskDifficulty(num){
  const smooth = Math.sqrt(num); // 1 → 1, 9 → 3, 25 → 5, 100 → 10
  return {
    spawnInterval: Math.max(0.55, 1.1 - smooth * 0.06),
    fallSpeed:     120 + smooth * 9,
    bombChance:    Math.min(0.18, 0.05 + smooth * 0.012),
    clockChance:   0.08
  };
}

// Проверка: сейчас передышка?
function isBreather(num){
  return num > 0 && num % BREATHER_EVERY === 0;
}

// ==================== СОСТОЯНИЕ ====================
const state = {
  lives: 3,
  timeLeft: START_TIME,
  taskNum: 1,
  tasksDone: 0,               // счётчик выполненных (для регенерации жизни)
  task: [],
  collected: {},
  combo: 0,
  running: false,
  items: [],
  spawnTimer: 0,
  lastTime: 0,
  cfg: null,
  started: false,
  pauseTimer: 0,
  breatherTimer: 0,           // таймер текущей передышки
  bestTasks: Number(localStorage.getItem('lion_bestTasks') || 0),
  bestTime: Number(localStorage.getItem('lion_bestTime') || 0),
  bestSession: Number(localStorage.getItem('lion_bestSession') || 0)
};

// ==================== ЛЬВЁНОК ====================
const lion = {
  x: W/2, y: H-120, w: 70, h: 70,
  vy: 0,
  jumpPower: JUMP_POWER
};

const trampoline = { x: W/2 - 130, y: H - 60, w: 260, h: 18 };

// ==================== ВВОД ====================
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key] = false; });

let pointerX = null;
let usePointer = false;

function pointerMove(clientX){
  const rect = canvas.getBoundingClientRect();
  const scale = W / rect.width;
  pointerX = (clientX - rect.left) * scale;
  usePointer = true;
}
canvas.addEventListener('mousemove', e => pointerMove(e.clientX));
canvas.addEventListener('mouseleave', () => { pointerX = null; });
canvas.addEventListener('touchstart', e => { pointerMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove',  e => { pointerMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend',   () => { pointerX = null; });

// ==================== HUD ====================
const hudLives = document.getElementById('lives');
const hudTime  = document.getElementById('time');
const hudTaskNum = document.getElementById('taskNum');
const hudTask  = document.getElementById('task');
const comboEl  = document.getElementById('combo');
const overlay  = document.getElementById('overlay');
const msgEl    = document.getElementById('msg');
const hintEl   = document.getElementById('hint');
const resetBtn = document.getElementById('resetBtn');

function updateHUD(){
  hudLives.textContent = state.lives;
  hudTime.textContent  = Math.max(0, Math.ceil(state.timeLeft));
  hudTaskNum.textContent = state.taskNum;
  const parts = state.task.map(t => {
    const got = state.collected[t.type] || 0;
    const done = got >= t.n;
    return `${done?'✅':''}${got}/${t.n} ${TYPES[t.type].emoji}`;
  });
  let text = 'Задание: ' + parts.join('  ');
  if(state.breatherTimer > 0){
    text = `☕ ПЕРЕДЫШКА ${Math.ceil(state.breatherTimer)}с  •  ` + text;
  }
  hudTask.textContent = text;
}

function showCombo(){
  if(state.combo < 2){ comboEl.classList.remove('show'); return; }
  comboEl.textContent = `🔥 Комбо ×${state.combo}`;
  comboEl.classList.add('show');
  clearTimeout(showCombo._t);
  showCombo._t = setTimeout(()=>comboEl.classList.remove('show'), 1200);
}

function flash(text, color='#fff'){
  const div = document.createElement('div');
  div.className = 'flash';
  div.textContent = text;
  div.style.color = color;
  document.getElementById('wrap').appendChild(div);
  setTimeout(() => div.remove(), 750);
}

// ==================== ЗВУК ====================
const Sound = {
  ctx: null,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
  beep(freq, dur, type='sine', vol=0.15){
    try{
      this.init();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    }catch(e){}
  },
  jump(){ this.beep(440, 0.15, 'square', 0.1); },
  collect(){ this.beep(880, 0.12, 'sine', 0.15); setTimeout(()=>this.beep(1320,0.1), 70); },
  wrong(){ this.beep(180, 0.25, 'sawtooth', 0.15); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'sine',0.15), i*100)); },
  fail(){ [400,300,200].forEach((f,i)=>setTimeout(()=>this.beep(f,0.25,'sawtooth',0.15), i*150)); },
  clock(){ this.beep(1200,0.08,'sine',0.15); setTimeout(()=>this.beep(1600,0.08),70); },
  regen(){ [660,880,1100].forEach((f,i)=>setTimeout(()=>this.beep(f,0.2,'sine',0.18), i*100)); }
};

// ==================== ЗАПУСК ИГРЫ ====================
function startGame(){
  state.lives = 3;
  state.timeLeft = START_TIME;
  state.taskNum = 1;
  state.tasksDone = 0;
  state.combo = 0;
  state.items = [];
  state.spawnTimer = 0.3;
  state.pauseTimer = 0;
  state.breatherTimer = 0;

  lion.x = W/2;
  lion.y = trampoline.y - lion.h;
  lion.vy = lion.jumpPower;

  nextTask();
  state.running = true;
  state.lastTime = performance.now();
  requestAnimationFrame(loop);
}

function nextTask(){
  state.task = makeTask(state.taskNum);
  state.collected = {};
  state.task.forEach(t => state.collected[t.type] = 0);
  state.cfg = taskDifficulty(state.taskNum);

  // Передышка каждые N заданий
  if(isBreather(state.taskNum)){
    state.breatherTimer = BREATHER_DURATION;
    flash('☕ Передышка!', '#7CFC00');
  } else {
    state.breatherTimer = 0;
  }

  updateHUD();
}

// ==================== СПАВН ====================
function spawnItem(){
  const cfg = state.cfg;

  // В передышке — все проще
  const inBreather = state.breatherTimer > 0;
  const bombChance = inBreather ? cfg.bombChance / BREATHER_LOOSEN : cfg.bombChance;
  const spawnMul = inBreather ? BREATHER_LOOSEN : 1;

  let type;
  const r = Math.random();
  if(r < bombChance){
    type = 'bomb';
  } else if(r < bombChance + cfg.clockChance){
    type = 'clock';
  } else {
    if(Math.random() < 0.6){
      const need = state.task.filter(t => (state.collected[t.type] || 0) < t.n);
      if(need.length){
        type = need[Math.floor(Math.random() * need.length)].type;
      } else {
        const pool = Object.keys(TYPES).filter(k => !['bomb','clock'].includes(k));
        type = pool[Math.floor(Math.random() * pool.length)];
      }
    } else {
      const pool = Object.keys(TYPES).filter(k => !['bomb','clock'].includes(k));
      type = pool[Math.floor(Math.random() * pool.length)];
    }
  }

  state.items.push({
    x: 60 + Math.random() * (W - 120),
    y: -40,
    r: 22,
    type,
    vy: cfg.fallSpeed * (0.85 + Math.random() * 0.3),
    rot: 0
  });
}

// ==================== ОБНОВЛЕНИЕ ====================
function update(dt){
  // Пауза после выполненного задания
  if(state.pauseTimer > 0){
    state.pauseTimer -= dt;
    updateLion(dt, 1.0);
    return;
  }

  // Передышка тикает и во время игры
  if(state.breatherTimer > 0){
    state.breatherTimer -= dt;
    if(state.breatherTimer <= 0){
      state.breatherTimer = 0;
      flash('Передышка окончена', '#ffaa00');
    }
    updateHUD();
  }

  const lifeScale = state.lives === 1 ? LOW_LIFE_SCALE : 1.0;
  const timeScale = BASE_TIME_SCALE * lifeScale;
  state.timeLeft -= dt * timeScale;
  if(state.timeLeft <= 0){
    state.timeLeft = 0;
    updateHUD();
    gameOver();
    return;
  }
  updateHUD();

  updateLion(dt, timeScale);

  // Спавн — в передышке реже
  state.spawnTimer -= dt;
  if(state.spawnTimer <= 0){
    spawnItem();
    let interval = state.cfg.spawnInterval;
    if(state.breatherTimer > 0) interval *= BREATHER_LOOSEN;
    state.spawnTimer = interval;
  }

  for(let i = state.items.length - 1; i >= 0; i--){
    const it = state.items[i];
    it.y += it.vy * dt * timeScale;
    it.rot += dt * 2.5;

    const dx = it.x - lion.x;
    const dy = it.y - (lion.y + lion.h/2);
    if(Math.hypot(dx, dy) < it.r + lion.w/2 - 12){
      catchItem(it);
      state.items.splice(i, 1);
      if(!state.running) return;
      continue;
    }
    if(it.y > H + 60) state.items.splice(i, 1);
  }
}

function updateLion(dt, timeScale){
  const speed = 420;
  let ax = 0;
  if(keys['ArrowLeft'] || keys['a'] || keys['A']) ax -= 1;
  if(keys['ArrowRight']|| keys['d'] || keys['D']) ax += 1;

  if(usePointer && pointerX !== null && ax === 0){
    const diff = pointerX - lion.x;
    if(Math.abs(diff) > 6){
      ax = Math.sign(diff) * Math.min(1, Math.abs(diff) / 100);
    }
  }
  if(keys['ArrowLeft']||keys['ArrowRight']||keys['a']||keys['d']||keys['A']||keys['D']){
    usePointer = false;
  }

  lion.x += ax * speed * dt;
  lion.x = Math.max(lion.w/2, Math.min(W - lion.w/2, lion.x));

  lion.vy += GRAVITY * dt * timeScale;
  lion.y += lion.vy * dt * timeScale;

  const lionBottom = lion.y + lion.h;
  if(lionBottom >= trampoline.y && lion.vy > 0){
    const overTrampoline = lion.x + lion.w/2 > trampoline.x &&
                           lion.x - lion.w/2 < trampoline.x + trampoline.w;
    if(overTrampoline){
      lion.y = trampoline.y - lion.h;
      lion.vy = lion.jumpPower;
      Sound.jump();
    } else if(lionBottom >= H - 10){
      lion.y = H - lion.h - 10;
      lion.vy = lion.jumpPower * 0.6;
      Sound.jump();
    }
  }
}

// ==================== ЛОВЛЯ ====================
function catchItem(it){
  const inBreather = state.breatherTimer > 0;

  if(it.type === 'clock'){
    state.timeLeft = Math.min(MAX_TIME, state.timeLeft + TIME_CLOCK_BONUS);
    flash(`⏰ +${TIME_CLOCK_BONUS}с`, '#7CFC00');
    Sound.clock();
    updateHUD();
    return;
  }

  if(it.type === 'bomb'){
    if(!inBreather){
      state.lives--;
      state.combo = 0;
      state.timeLeft = Math.max(1, state.timeLeft - TIME_PENALTY);
      flash(`💣 −${TIME_PENALTY}с  ❤️-1`, '#ff5555');
    } else {
      flash(`💣 (передышка)`, '#ffaa00');
    }
    Sound.wrong();
    if(state.lives <= 0){ gameOver(); return; }
    updateHUD();
    return;
  }

  const taskItem = state.task.find(t => t.type === it.type);
  if(taskItem && state.collected[it.type] < taskItem.n){
    state.collected[it.type]++;
    Sound.collect();
    updateHUD();
    if(state.task.every(t => state.collected[t.type] >= t.n)){
      completeTask();
    }
  } else {
    if(!inBreather){
      state.lives--;
      state.combo = 0;
      state.timeLeft = Math.max(1, state.timeLeft - TIME_PENALTY);
      flash(`❌ Лишний  −${TIME_PENALTY}с  ❤️-1`, '#ffaa00');
    } else {
      flash(`❌ (передышка)`, '#ffaa00');
    }
    Sound.wrong();
    if(state.lives <= 0){ gameOver(); return; }
    updateHUD();
  }
}

// ==================== ЗАДАНИЕ ВЫПОЛНЕНО ====================
function completeTask(){
  state.combo++;
  state.tasksDone++;

  const bonus = TIME_BONUS_BASE + state.combo * TIME_BONUS_COMBO;
  state.timeLeft = Math.min(MAX_TIME, state.timeLeft + bonus);
  flash(`✅ +${bonus}с  (комбо ×${state.combo})`, '#7CFC00');
  Sound.win();
  showCombo();

  // Регенерация жизни
  if(state.tasksDone > 0 && state.tasksDone % LIFE_REGEN_EVERY === 0 && state.lives < MAX_LIVES){
    state.lives++;
    flash(`❤️ +1 жизнь!`, '#ff69b4');
    Sound.regen();
  }

  // Рекорды
  if(state.taskNum > state.bestTasks){
    state.bestTasks = state.taskNum;
    localStorage.setItem('lion_bestTasks', state.bestTasks);
  }
  if(state.timeLeft > state.bestTime){
    state.bestTime = Math.floor(state.timeLeft);
    localStorage.setItem('lion_bestTime', state.bestTime);
  }

  state.taskNum++;
  nextTask();

  state.pauseTimer = PAUSE_BETWEEN;
  state.items = [];
}

// ==================== ОТРИСОВКА ====================
function draw(){
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#FFE4B5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const t = performance.now() * 0.02;
  for(let i = 0; i < 5; i++){
    const x = ((i * 220 + t) % (W + 200)) - 100;
    const y = 60 + (i % 3) * 40;
    ctx.beginPath();
    ctx.arc(x, y, 32, 0, Math.PI*2);
    ctx.arc(x + 30, y + 8, 26, 0, Math.PI*2);
    ctx.arc(x - 30, y + 8, 24, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,230,100,0.9)';
  ctx.beginPath();
  ctx.arc(W - 90, 90, 45, 0, Math.PI*2);
  ctx.fill();

  // Батут
  ctx.fillStyle = '#c0392b';
  roundRect(trampoline.x, trampoline.y, trampoline.w, trampoline.h, 9);
  ctx.fill();
  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(trampoline.x + 12, trampoline.y + trampoline.h, 10, 40);
  ctx.fillRect(trampoline.x + trampoline.w - 22, trampoline.y + trampoline.h, 10, 40);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(trampoline.x + 8, trampoline.y + 3, trampoline.w - 16, 5, 3);
  ctx.fill();

  // Предметы
  ctx.font = '40px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const it of state.items){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(Math.sin(it.rot) * 0.35);
    ctx.fillText(TYPES[it.type].emoji, 0, 0);
    ctx.restore();
  }

  // Тень
  const shadowScale = Math.max(0.3, 1 - (H - lion.y - lion.h) / 500);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(lion.x, trampoline.y + 2, 35 * shadowScale, 8 * shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  // Львёнок
  ctx.font = '70px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(lion.x, lion.y + lion.h/2);
  ctx.fillText('🦁', 0, 0);
  ctx.restore();

  // Пауза
  if(state.pauseTimer > 0){
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, H/2 - 40, W, 80);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸ Готовься!', W/2, H/2);
  }

  // Индикатор передышки (мягкая рамка)
  if(state.breatherTimer > 0){
    ctx.strokeStyle = 'rgba(124,252,0,0.6)';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W-6, H-6);
  }

  // Таймер
  const p = Math.max(0, Math.min(1, state.timeLeft / MAX_TIME));
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H - 10, W, 10);
  const color = state.timeLeft < 8 ? '#e74c3c' :
                state.timeLeft < 20 ? '#f39c12' : '#2ecc71';
  ctx.fillStyle = color;
  ctx.fillRect(0, H - 10, W * p, 10);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ==================== ЦИКЛ ====================
function loop(t){
  if(!state.running) return;
  const dt = Math.min(0.05, (t - state.lastTime) / 1000);
  state.lastTime = t;
  update(dt);
  if(state.running){
    draw();
    requestAnimationFrame(loop);
  }
}

// ==================== ИГРА ОКОНЧЕНА ====================
function gameOver(){
  state.running = false;
  Sound.fail();

  const sessionTasks = state.taskNum - 1;
  if(sessionTasks > state.bestSession){
    state.bestSession = sessionTasks;
    localStorage.setItem('lion_bestSession', state.bestSession);
  }

  const recordMsg =
    `🏆 Рекорды:\n` +
    `Заданий подряд: ${state.bestTasks}\n` +
    `Макс. время: ${state.bestTime}с\n` +
    `Лучшая сессия: ${state.bestSession} заданий\n\n` +
    `В этот раз:\n` +
    `Заданий: ${sessionTasks}\n` +
    `Осталось времени: ${Math.floor(state.timeLeft)}с`;

  showOverlay(recordMsg, 'Нажми, чтобы играть заново', true, () => {
    startGame();
  });
}

function showOverlay(text, hint, showReset, cb){
  msgEl.textContent = text;
  hintEl.textContent = hint;
  resetBtn.style.display = showReset ? 'inline-block' : 'none';
  overlay.classList.remove('hidden');
  overlay.onclick = (e) => {
    if(e.target === resetBtn) return;
    overlay.classList.add('hidden');
    cb();
  };
  resetBtn.onclick = (e) => {
    e.stopPropagation();
    localStorage.removeItem('lion_bestTasks');
    localStorage.removeItem('lion_bestTime');
    localStorage.removeItem('lion_bestSession');
    state.bestTasks = 0;
    state.bestTime = 0;
    state.bestSession = 0;
    flash('Рекорды сброшены', '#fff');
  };
}

// ==================== СТАРТ ====================
overlay.onclick = () => {
  overlay.classList.add('hidden');
  state.started = true;
  startGame();
};

// Ресайз
function fitCanvas(){
  const wrap = document.getElementById('wrap');
  const scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
addEventListener('resize', fitCanvas);
fitCanvas();

})();
</script>
