<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Львёнок на батуте</title>
<style>
  html,body{
    margin:0;height:100%;background:#87CEEB;overflow:hidden;
    font-family:'Comic Sans MS','Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #wrap{
    position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#87CEEB;
  }
  canvas{
    display:block;background:linear-gradient(#87CEEB 0%,#FFE4B5 100%);
    max-width:100%;max-height:100%;
    touch-action:none;
  }
  #hud{
    position:absolute;top:0;left:0;right:0;padding:8px 14px;
    color:#fff;text-shadow:2px 2px 0 #000,0 0 8px #000;
    font-size:20px;pointer-events:none;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  #hudLeft{font-size:18px;line-height:1.4;}
  #task{
    font-size:22px;font-weight:bold;text-align:right;line-height:1.4;
    flex:1;
  }
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.7);color:#fff;font-size:30px;text-align:center;
    flex-direction:column;cursor:pointer;z-index:10;padding:20px;
  }
  #overlay.hidden{display:none;}
  #msg{max-width:90%;line-height:1.4;white-space:pre-line;text-shadow:2px 2px 0 #000;}
  #hint{font-size:16px;margin-top:24px;opacity:.85;}
  #resetBtn{
    margin-top:20px;padding:10px 24px;font-size:16px;
    background:#e74c3c;color:#fff;border:2px solid #fff;border-radius:8px;
    cursor:pointer;font-family:inherit;display:none;
  }
  #resetBtn:hover{background:#c0392b;}
  .flash{
    position:absolute;top:120px;left:50%;transform:translateX(-50%);
    font-size:38px;color:#fff;text-shadow:3px 3px 0 #000;
    pointer-events:none;z-index:8;font-weight:bold;
    animation:pop 0.6s ease-out forwards;
  }
  @keyframes pop{
    0%{opacity:0;transform:translateX(-50%) scale(.6);}
    20%{opacity:1;transform:translateX(-50%) scale(1.1);}
    100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-40px);}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="hud">
    <div id="hudLeft">❤️ <span id="lives">3</span><br>⏱ <span id="time">20</span>с<br>Ур. <span id="level">1</span></div>
    <div id="task">Задание: —</div>
  </div>
  <div id="overlay">
    <div id="msg">🦁 Львёнок на батуте!</div>
    <div id="hint">Нажми, чтобы начать</div>
    <button id="resetBtn">Начать заново</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ==================== КОНСТАНТЫ ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const GRAVITY = 1600;
const JUMP_HEIGHT = H * (2/3);
const JUMP_POWER = -Math.sqrt(2 * GRAVITY * JUMP_HEIGHT);

const TYPES = {
  red:    {emoji:'🔴', name:'красный шарик'},
  blue:   {emoji:'🔵', name:'синий шарик'},
  green:  {emoji:'🟢', name:'зелёный шарик'},
  cake:   {emoji:'🍰', name:'тортик'},
  star:   {emoji:'⭐', name:'звезда'},
  apple:  {emoji:'🍎', name:'яблоко'},
  bomb:   {emoji:'💣', name:'бомба'}
};

// ==================== УРОВНИ ====================
function makeLevel(n){
  const isBoss = (n % 10 === 0);
  const tasks = [
    [{type:'red', n:3}],
    [{type:'red', n:2},{type:'cake', n:1}],
    [{type:'star', n:3}],
    [{type:'blue', n:2},{type:'apple', n:1}],
    [{type:'red', n:2},{type:'blue', n:2},{type:'star', n:1}],
    [{type:'cake', n:2},{type:'star', n:2},{type:'apple', n:2}],
    [{type:'green', n:3},{type:'cake', n:1}],
    [{type:'red', n:3},{type:'blue', n:2},{type:'apple', n:1}],
    [{type:'star', n:4},{type:'cake', n:2}],
    [{type:'star', n:5},{type:'cake', n:3},{type:'red', n:3}]
  ];
  const t = tasks[(n-1) % tasks.length];

  const baseTime   = isBoss ? 35 : 22;
  const baseSpawn  = isBoss ? 0.7 : 1.0;
  const baseSpeed  = 130;
  const cycle = Math.floor((n-1)/tasks.length);

  return {
    task: t,
    time: Math.max(12, baseTime - cycle*1.5),
    spawnInterval: Math.max(0.35, baseSpawn - cycle*0.06 - (isBoss?0:0.01*n)),
    fallSpeed: baseSpeed + n*14,
    bombChance: Math.min(0.4, (isBoss?0.3:0.12) + cycle*0.03),
    isBoss
  };
}

// ==================== СОСТОЯНИЕ ====================
const state = {
  level: 1,
  lives: 3,
  timeLeft: 20,
  task: [],
  collected: {},
  running: false,
  items: [],
  spawnTimer: 0,
  lastTime: 0,
  cfg: null,
  started: false
};

// ==================== ЛЬВЁНОК ====================
const lion = {
  x: W/2, y: H-120, w: 70, h: 70,
  vy: 0,
  jumpPower: JUMP_POWER
};

const trampoline = { x: W/2 - 130, y: H - 60, w: 260, h: 18 };

// ==================== ВВОД ====================
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key] = false; });

let pointerX = null;
let usePointer = false;

function pointerMove(clientX){
  const rect = canvas.getBoundingClientRect();
  const scale = W / rect.width;
  pointerX = (clientX - rect.left) * scale;
  usePointer = true;
}
canvas.addEventListener('mousemove', e => pointerMove(e.clientX));
canvas.addEventListener('mouseleave', () => { pointerX = null; });
canvas.addEventListener('touchstart', e => { pointerMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove',  e => { pointerMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend',   () => { pointerX = null; });

// ==================== HUD ====================
const hudLives = document.getElementById('lives');
const hudTime  = document.getElementById('time');
const hudLevel = document.getElementById('level');
const hudTask  = document.getElementById('task');
const overlay  = document.getElementById('overlay');
const msgEl    = document.getElementById('msg');
const hintEl   = document.getElementById('hint');
const resetBtn = document.getElementById('resetBtn');

function updateHUD(){
  hudLives.textContent = state.lives;
  hudTime.textContent  = Math.max(0, Math.ceil(state.timeLeft));
  hudLevel.textContent = state.level + (state.cfg?.isBoss ? ' 👹' : '');
  const parts = state.task.map(t => {
    const got = state.collected[t.type] || 0;
    const done = got >= t.n;
    return `${done?'✅':''}${got}/${t.n} ${TYPES[t.type].emoji}`;
  });
  hudTask.textContent = 'Задание: ' + parts.join('  ');
}

function flash(text, color='#fff'){
  const div = document.createElement('div');
  div.className = 'flash';
  div.textContent = text;
  div.style.color = color;
  document.getElementById('wrap').appendChild(div);
  setTimeout(() => div.remove(), 650);
}

// ==================== ЗВУК ====================
const Sound = {
  ctx: null,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
  beep(freq, dur, type='sine', vol=0.15){
    try{
      this.init();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    }catch(e){}
  },
  jump(){ this.beep(440, 0.15, 'square', 0.1); },
  collect(){ this.beep(880, 0.12, 'sine', 0.15); setTimeout(()=>this.beep(1320,0.1), 70); },
  wrong(){ this.beep(180, 0.25, 'sawtooth', 0.15); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'sine',0.15), i*100)); },
  fail(){ [400,300,200].forEach((f,i)=>setTimeout(()=>this.beep(f,0.25,'sawtooth',0.15), i*150)); }
};

// ==================== ЗАПУСК УРОВНЯ ====================
function startLevel(){
  const cfg = makeLevel(state.level);
  state.cfg = cfg;
  state.task = cfg.task;
  state.collected = {};
  cfg.task.forEach(t => state.collected[t.type] = 0);
  state.timeLeft = cfg.time;
  state.items = [];
  state.spawnTimer = 0.3;

  lion.x = W/2;
  lion.y = trampoline.y - lion.h;
  lion.vy = lion.jumpPower;

  updateHUD();
  state.running = true;
  state.lastTime = performance.now();
  requestAnimationFrame(loop);
}

// ==================== СПАВН ====================
function spawnItem(){
  const cfg = state.cfg;
  let type;

  if(Math.random() < cfg.bombChance){
    type = 'bomb';
  } else {
    if(Math.random() < 0.6){
      const need = state.task.filter(t => (state.collected[t.type] || 0) < t.n);
      if(need.length){
        type = need[Math.floor(Math.random() * need.length)].type;
      } else {
        const pool = Object.keys(TYPES).filter(k => k !== 'bomb');
        type = pool[Math.floor(Math.random() * pool.length)];
      }
    } else {
      const pool = Object.keys(TYPES).filter(k => k !== 'bomb');
      type = pool[Math.floor(Math.random() * pool.length)];
    }
  }

  state.items.push({
    x: 60 + Math.random() * (W - 120),
    y: -40,
    r: 22,
    type,
    vy: cfg.fallSpeed * (0.85 + Math.random() * 0.3),
    rot: 0
  });
}

// ==================== ОБНОВЛЕНИЕ ====================
function update(dt){
  state.timeLeft -= dt;
  if(state.timeLeft <= 0){
    fail('⏰ Время вышло!');
    return;
  }

  const speed = 420;
  let ax = 0;
  if(keys['ArrowLeft'] || keys['a'] || keys['A']) ax -= 1;
  if(keys['ArrowRight']|| keys['d'] || keys['D']) ax += 1;

  if(usePointer && pointerX !== null && ax === 0){
    const diff = pointerX - lion.x;
    if(Math.abs(diff) > 6){
      ax = Math.sign(diff) * Math.min(1, Math.abs(diff) / 100);
    }
  }
  if(keys['ArrowLeft']||keys['ArrowRight']||keys['a']||keys['d']||keys['A']||keys['D']){
    usePointer = false;
  }

  lion.x += ax * speed * dt;
  lion.x = Math.max(lion.w/2, Math.min(W - lion.w/2, lion.x));

  lion.vy += GRAVITY * dt;
  lion.y += lion.vy * dt;

  const lionBottom = lion.y + lion.h;
  if(lionBottom >= trampoline.y && lion.vy > 0){
    const overTrampoline = lion.x + lion.w/2 > trampoline.x &&
                           lion.x - lion.w/2 < trampoline.x + trampoline.w;
    if(overTrampoline){
      lion.y = trampoline.y - lion.h;
      lion.vy = lion.jumpPower;
      Sound.jump();
    } else if(lionBottom >= H - 10){
      lion.y = H - lion.h - 10;
      lion.vy = lion.jumpPower * 0.6;
      Sound.jump();
    }
  }

  state.spawnTimer -= dt;
  if(state.spawnTimer <= 0){
    spawnItem();
    state.spawnTimer = state.cfg.spawnInterval;
  }

  for(let i = state.items.length - 1; i >= 0; i--){
    const it = state.items[i];
    it.y += it.vy * dt;
    it.rot += dt * 2.5;

    const dx = it.x - lion.x;
    const dy = it.y - (lion.y + lion.h/2);
    if(Math.hypot(dx, dy) < it.r + lion.w/2 - 12){
      catchItem(it);
      state.items.splice(i, 1);
      if(!state.running) return;
      continue;
    }
    if(it.y > H + 60) state.items.splice(i, 1);
  }
}

// ==================== ЛОВЛЯ ====================
function catchItem(it){
  if(it.type === 'bomb'){
    state.lives--;
    flash('💣 Бомба!', '#ff5555');
    Sound.wrong();
    if(state.lives <= 0){ fail('💀 Жизни кончились!'); return; }
    updateHUD();
    return;
  }

  const taskItem = state.task.find(t => t.type === it.type);
  if(taskItem && state.collected[it.type] < taskItem.n){
    state.collected[it.type]++;
    Sound.collect();
    updateHUD();
    if(state.task.every(t => state.collected[t.type] >= t.n)){
      win();
    }
  } else {
    state.lives--;
    flash('❌ Лишний!', '#ffaa00');
    Sound.wrong();
    if(state.lives <= 0){ fail('💀 Жизни кончились!'); return; }
    updateHUD();
  }
}

// ==================== ОТРИСОВКА ====================
function draw(){
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#FFE4B5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const t = performance.now() * 0.02;
  for(let i = 0; i < 5; i++){
    const x = ((i * 220 + t) % (W + 200)) - 100;
    const y = 60 + (i % 3) * 40;
    ctx.beginPath();
    ctx.arc(x, y, 32, 0, Math.PI*2);
    ctx.arc(x + 30, y + 8, 26, 0, Math.PI*2);
    ctx.arc(x - 30, y + 8, 24, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,230,100,0.9)';
  ctx.beginPath();
  ctx.arc(W - 90, 90, 45, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#c0392b';
  roundRect(trampoline.x, trampoline.y, trampoline.w, trampoline.h, 9);
  ctx.fill();

  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(trampoline.x + 12, trampoline.y + trampoline.h, 10, 40);
  ctx.fillRect(trampoline.x + trampoline.w - 22, trampoline.y + trampoline.h, 10, 40);

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(trampoline.x + 8, trampoline.y + 3, trampoline.w - 16, 5, 3);
  ctx.fill();

  ctx.font = '40px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const it of state.items){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(Math.sin(it.rot) * 0.35);
    ctx.fillText(TYPES[it.type].emoji, 0, 0);
    ctx.restore();
  }

  const shadowScale = Math.max(0.3, 1 - (H - lion.y - lion.h) / 500);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(lion.x, trampoline.y + 2, 35 * shadowScale, 8 * shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.font = '70px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(lion.x, lion.y + lion.h/2);
  ctx.fillText('🦁', 0, 0);
  ctx.restore();

  const p = Math.max(0, state.timeLeft / state.cfg.time);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H - 10, W, 10);
  ctx.fillStyle = p > 0.5 ? '#2ecc71' : p > 0.25 ? '#f39c12' : '#e74c3c';
  ctx.fillRect(0, H - 10, W * p, 10);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ==================== ЦИКЛ ====================
function loop(t){
  if(!state.running) return;
  const dt = Math.min(0.05, (t - state.lastTime) / 1000);
  state.lastTime = t;
  update(dt);
  if(state.running){
    draw();
    requestAnimationFrame(loop);
  }
}

// ==================== ПОБЕДА / ПРОВАЛ ====================
function win(){
  state.running = false;
  Sound.win();

  const record = Number(localStorage.getItem('lion_record') || 0);
  if(state.level > record) localStorage.setItem('lion_record', state.level);
  localStorage.setItem('lion_progress', state.level + 1);

  const nextLevel = state.level + 1;
  const nextIsBoss = (nextLevel % 10 === 0);
  const bossMsg = nextIsBoss ? '\n\n👹 ВПЕРЕДИ БОСС-УРОВЕНЬ!' : '';

  showOverlay(
    `🏆 Уровень ${state.level} пройден!${bossMsg}\n\nРекорд: ${Math.max(record, state.level)}`,
    'Нажми, чтобы продолжить',
    false,
    () => {
      state.level++;
      startLevel();
    }
  );
}

function fail(reason){
  state.running = false;
  Sound.fail();

  showOverlay(
    `${reason}\n\nПовторяем уровень ${state.level}\nРекорд: ${localStorage.getItem('lion_record') || 1}`,
    'Нажми, чтобы повторить уровень',
    true,
    () => {
      state.lives = 3;
      startLevel();
    }
  );
}

function showOverlay(text, hint, showReset, cb){
  msgEl.textContent = text;
  hintEl.textContent = hint;
  resetBtn.style.display = showReset ? 'inline-block' : 'none';
  overlay.classList.remove('hidden');
  overlay.onclick = (e) => {
    if(e.target === resetBtn) return;
    overlay.classList.add('hidden');
    cb();
  };
  resetBtn.onclick = (e) => {
    e.stopPropagation();
    localStorage.removeItem('lion_progress');
    localStorage.removeItem('lion_record');
    state.level = 1;
    state.lives = 3;
    overlay.classList.add('hidden');
    startLevel();
  };
}

// ==================== СТАРТ ====================
overlay.onclick = () => {
  overlay.classList.add('hidden');
  if(!state.started){
    const saved = Number(localStorage.getItem('lion_progress') || 1);
    state.level = saved;
    state.started = true;
  }
  startLevel();
};

// Ресайз
function fitCanvas(){
  const wrap = document.getElementById('wrap');
  const scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
addEventListener('resize', fitCanvas);
fitCanvas();

})();
</script>
</body>
</html>
