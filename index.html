<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Львёнок на батуте</title>
<style>
  html,body{margin:0;height:100%;background:#87CEEB;overflow:hidden;
    font-family:'Comic Sans MS','Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;}
  #wrap{position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;background:#87CEEB;}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none;}
  #hud{position:absolute;top:0;left:0;right:0;padding:8px 14px;
    color:#fff;text-shadow:2px 2px 0 #000,0 0 8px #000;
    font-size:20px;pointer-events:none;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #hudLeft{font-size:18px;line-height:1.4;}
  #task{font-size:22px;font-weight:bold;text-align:right;line-height:1.4;flex:1;}
  #combo{position:absolute;top:150px;left:50%;transform:translateX(-50%);
    font-size:26px;font-weight:bold;color:#ffeb3b;
    text-shadow:2px 2px 0 #000;pointer-events:none;z-index:6;
    opacity:0;transition:opacity .2s;}
  #combo.show{opacity:1;}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.75);color:#fff;font-size:26px;text-align:center;
    flex-direction:column;cursor:pointer;z-index:10;padding:20px;}
  #overlay.hidden{display:none;}
  #msg{max-width:90%;line-height:1.4;white-space:pre-line;text-shadow:2px 2px 0 #000;}
  #hint{font-size:16px;margin-top:24px;opacity:.85;}
  .btn{margin-top:16px;padding:10px 24px;font-size:16px;
    background:#3498db;color:#fff;border:2px solid #fff;border-radius:8px;
    cursor:pointer;font-family:inherit;}
  .btn.red{background:#e74c3c;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="hud">
    <div id="hudLeft">❤️ <span id="lives">5</span><br>⏱ <span id="time">60</span>с<br>Задание <span id="taskNum">1</span></div>
    <div id="task">Задание: —</div>
  </div>
  <div id="combo"></div>
  <div id="overlay">
    <div id="msg">🦁 Львёнок на батуте!</div>
    <div id="hint">Нажми, чтобы начать</div>
    <button class="btn red" id="resetBtn" style="display:none">Сбросить рекорд</button>
  </div>
</div>

<script>
(function(){
'use strict';

// ========== КОНСТАНТЫ ==========
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;

var GRAVITY = 1600;
var JUMP_HEIGHT = H * (2/3);
var JUMP_POWER = -Math.sqrt(2 * GRAVITY * JUMP_HEIGHT);

var START_TIME = 60, TIME_BONUS_BASE = 12, TIME_BONUS_COMBO = 2;
var TIME_PENALTY = 1, TIME_CLOCK_BONUS = 6, MAX_TIME = 180;
var BASE_TIME_SCALE = 0.85, LOW_LIFE_SCALE = 0.6, PAUSE_BETWEEN = 0.6;

// --- Жизни: стало заметно щедрее ---
var START_LIVES          = 5;    // было 3
var MAX_LIVES            = 9;    // было 5
var LIFE_REGEN_EVERY     = 5;    // было 8 — чаще +1 жизнь за задания
var HEART_DROP_CHANCE    = 0.06; // шанс выпадения бонусного ❤️
var HEART_DROP_MIN_LIVES = 0;    // падает всегда, если < MAX_LIVES

var BREATHER_EVERY = 5, BREATHER_DURATION = 12, BREATHER_LOOSEN = 1.5;
var MAX_ITEMS = 30, HUD_THROTTLE_MS = 100, SOUND_THROTTLE_MS = 60;

var TYPES = {
  red:{e:'🔴'}, blue:{e:'🔵'}, green:{e:'🟢'},
  cake:{e:'🍰'}, star:{e:'⭐'}, apple:{e:'🍎'},
  bomb:{e:'💣'}, clock:{e:'⏰'}, heart:{e:'❤️'}
};

// ========== ЗАДАНИЯ ==========
function makeTask(num){
  var tmpl = [
    [{type:'red', n:3}],
    [{type:'red', n:2},{type:'cake', n:1}],
    [{type:'star', n:3}],
    [{type:'blue', n:2},{type:'apple', n:1}],
    [{type:'red', n:2},{type:'blue', n:2},{type:'star', n:1}],
    [{type:'cake', n:2},{type:'star', n:2},{type:'apple', n:2}],
    [{type:'green', n:3},{type:'cake', n:1}],
    [{type:'red', n:3},{type:'blue', n:2},{type:'apple', n:1}],
    [{type:'star', n:4},{type:'cake', n:2}],
    [{type:'green', n:2},{type:'red', n:2},{type:'blue', n:2},{type:'star', n:1}]
  ];
  var cycle = Math.floor((num - 1) / tmpl.length);
  var base = tmpl[(num - 1) % tmpl.length];
  var extra = Math.floor(cycle / 3);
  var out = [];
  for(var i = 0; i < base.length; i++){
    out.push({ type: base[i].type, n: base[i].n + (extra > 0 && i === 0 ? extra : 0) });
  }
  return out;
}

function taskDifficulty(num){
  var s = Math.sqrt(num);
  return {
    spawnInterval: Math.max(0.55, 1.1 - s * 0.06),
    fallSpeed:     120 + s * 9,
    bombChance:    Math.min(0.18, 0.05 + s * 0.012),
    clockChance:   0.08,
    heartChance:   HEART_DROP_CHANCE
  };
}

function isBreather(n){ return n > 0 && n % BREATHER_EVERY === 0; }

// ========== СОСТОЯНИЕ ==========
var state = {
  lives: START_LIVES, timeLeft: START_TIME, taskNum: 1, tasksDone: 0,
  task: [], collected: {}, combo: 0,
  running: false, starting: false,
  items: [], spawnTimer: 0, lastTime: 0, cfg: null,
  pauseTimer: 0, breatherTimer: 0, rafId: 0,
  lastHudUpdate: 0, clearItemsNextFrame: false,
  flashes: [],
  bestTasks: Number(localStorage.getItem('lion_bestTasks') || 0),
  bestTime: Number(localStorage.getItem('lion_bestTime') || 0),
  bestSession: Number(localStorage.getItem('lion_bestSession') || 0)
};

var lion = {
  x: W/2, y: H-120, w: 70, h: 70, vy: 0,
  jumpPower: JUMP_POWER, justBounced: false
};

var trampoline = { x: W/2 - 130, y: H - 60, w: 260, h: 18 };

// ========== ВВОД ==========
var keys = {};
window.addEventListener('keydown', function(e){
  keys[e.key] = true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ keys[e.key] = false; });

var pointerX = null, usePointer = false;
function pointerMove(clientX){
  var rect = canvas.getBoundingClientRect();
  pointerX = (clientX - rect.left) * (W / rect.width);
  usePointer = true;
}
canvas.addEventListener('mousemove', function(e){ pointerMove(e.clientX); });
canvas.addEventListener('mouseleave', function(){ pointerX = null; });
canvas.addEventListener('touchstart', function(e){ pointerMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove',  function(e){ pointerMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend',   function(){ pointerX = null; });

// ========== HUD ==========
var hudLives = document.getElementById('lives');
var hudTime  = document.getElementById('time');
var hudTaskNum = document.getElementById('taskNum');
var hudTask  = document.getElementById('task');
var comboEl  = document.getElementById('combo');
var overlay  = document.getElementById('overlay');
var msgEl    = document.getElementById('msg');
var hintEl   = document.getElementById('hint');
var resetBtn = document.getElementById('resetBtn');

var hudCache = { lives:-1, time:-1, taskNum:-1, text:'' };

function updateHUD(force){
  var now = performance.now();
  if(!force && now - state.lastHudUpdate < HUD_THROTTLE_MS) return;
  state.lastHudUpdate = now;

  var lives = state.lives;
  var time  = Math.max(0, Math.ceil(state.timeLeft));
  var tnum  = state.taskNum;

  if(lives !== hudCache.lives){ hudLives.textContent = lives; hudCache.lives = lives; }
  if(time  !== hudCache.time ){ hudTime.textContent  = time;  hudCache.time  = time; }
  if(tnum  !== hudCache.taskNum){ hudTaskNum.textContent = tnum; hudCache.taskNum = tnum; }

  var parts = [];
  for(var i = 0; i < state.task.length; i++){
    var t = state.task[i];
    var got = state.collected[t.type] || 0;
    var done = got >= t.n;
    parts.push((done ? '✅' : '') + got + '/' + t.n + ' ' + TYPES[t.type].e);
  }
  var text = 'Задание: ' + parts.join('  ');
  if(state.breatherTimer > 0){
    text = '☕ ПЕРЕДЫШКА ' + Math.ceil(state.breatherTimer) + 'с  •  ' + text;
  }
  if(text !== hudCache.text){ hudTask.textContent = text; hudCache.text = text; }
}

function showCombo(){
  if(state.combo < 2){ comboEl.classList.remove('show'); return; }
  comboEl.textContent = '🔥 Комбо ×' + state.combo;
  comboEl.classList.add('show');
  clearTimeout(showCombo._t);
  showCombo._t = setTimeout(function(){ comboEl.classList.remove('show'); }, 1200);
}

// ========== ВСПЫШКИ ==========
function flash(text, color){
  for(var i = 0; i < state.flashes.length; i++){
    if(state.flashes[i].text === text){
      state.flashes[i].t = state.flashes[i].life;
      state.flashes[i].color = color || '#fff';
      return;
    }
  }
  state.flashes.push({ text: text, color: color || '#fff', life: 0.9, t: 0.9 });
  while(state.flashes.length > 3) state.flashes.shift();
}

function drawFlashes(dt){
  for(var i = 0; i < state.flashes.length; i++){
    var f = state.flashes[i];
    f.t -= dt;
    if(f.t <= 0) continue;

    var progress = 1 - f.t / f.life;
    var baseY = 110 + i * 52;
    var y = baseY - progress * 25;
    var alpha = f.t > 0.35 ? 1 : f.t / 0.35;
    var scale = progress < 0.2 ? 0.7 + progress * 1.5 : 1.0 - (progress - 0.2) * 0.1;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W/2, y);
    ctx.scale(scale, scale);
    ctx.font = 'bold 34px "Comic Sans MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#000';
    ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
  for(var j = state.flashes.length - 1; j >= 0; j--){
    if(state.flashes[j].t <= 0) state.flashes.splice(j, 1);
  }
}

// ========== ЗВУК ==========
var Sound = {
  ctx: null, lastPlay: {},
  init: function(){
    if(!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ this.ctx = null; }
    }
    if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume().catch(function(){}); }
  },
  beep: function(freq, dur, type, vol, key){
    var now = performance.now();
    var last = this.lastPlay[key] || 0;
    if(now - last < SOUND_THROTTLE_MS) return;
    this.lastPlay[key] = now;
    try{
      this.init();
      if(!this.ctx) return;
      var t0 = this.ctx.currentTime;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + dur);
      o.onended = function(){ try { o.disconnect(); g.disconnect(); } catch(e){} };
    }catch(e){}
  },
  jump:    function(){ this.beep(440, 0.12, 'square', 0.08, 'jump'); },
  collect: function(){ this.beep(880, 0.10, 'sine',   0.12, 'collect'); },
  wrong:   function(){ this.beep(180, 0.20, 'sawtooth', 0.12, 'wrong'); },
  win:     function(){ this.beep(784, 0.18, 'sine',   0.14, 'win'); },
  fail:    function(){ this.beep(200, 0.40, 'sawtooth', 0.14, 'fail'); },
  clock:   function(){ this.beep(1400, 0.10, 'sine',  0.14, 'clock'); },
  regen:   function(){ this.beep(1100, 0.20, 'sine',  0.16, 'regen'); },
  heart:   function(){ this.beep(1200, 0.15, 'sine',  0.18, 'heart'); }
};

// ========== ЗАПУСК ==========
function startGame(){
  if(state.starting) return;
  state.starting = true;

  state.lives = START_LIVES;
  state.timeLeft = START_TIME;
  state.taskNum = 1;
  state.tasksDone = 0;
  state.combo = 0;
  state.items = [];
  state.flashes = [];
  state.spawnTimer = 0.3;
  state.pauseTimer = 0;
  state.breatherTimer = 0;
  state.lastHudUpdate = 0;
  state.clearItemsNextFrame = false;

  hudCache = { lives:-1, time:-1, taskNum:-1, text:'' };

  lion.x = W/2;
  lion.y = trampoline.y - lion.h;
  lion.vy = lion.jumpPower;
  lion.justBounced = false;

  Sound.init();

  buildTask(1);

  state.running = true;
  state.starting = false;
  state.lastTime = performance.now();

  if(state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = requestAnimationFrame(loop);
}

function buildTask(num){
  state.task = makeTask(num);
  state.collected = {};
  for(var i = 0; i < state.task.length; i++){
    state.collected[state.task[i].type] = 0;
  }
  state.cfg = taskDifficulty(num);

  if(isBreather(num)){
    state.breatherTimer = BREATHER_DURATION;
    flash('☕ Передышка!', '#7CFC00');
  } else {
    state.breatherTimer = 0;
  }
  updateHUD(true);
}

// ========== СПАВН ==========
function spawnItem(){
  if(state.items.length >= MAX_ITEMS) return;

  var cfg = state.cfg;
  var inBreather = state.breatherTimer > 0;
  var bombChance = inBreather ? cfg.bombChance / BREATHER_LOOSEN : cfg.bombChance;

  // Шанс сердца падает, только если жизней меньше максимума
  var heartChance = (state.lives < MAX_LIVES && state.lives >= HEART_DROP_MIN_LIVES)
                    ? cfg.heartChance : 0;

  var type;
  var r = Math.random();
  if(r < heartChance){
    type = 'heart';
  } else if(r < heartChance + bombChance){
    type = 'bomb';
  } else if(r < heartChance + bombChance + cfg.clockChance){
    type = 'clock';
  } else {
    if(Math.random() < 0.6){
      var need = [];
      for(var i = 0; i < state.task.length; i++){
        var t = state.task[i];
        if((state.collected[t.type] || 0) < t.n) need.push(t.type);
      }
      if(need.length){
        type = need[Math.floor(Math.random() * need.length)];
      } else {
        var pool0 = ['red','blue','green','cake','star','apple'];
        type = pool0[Math.floor(Math.random() * pool0.length)];
      }
    } else {
      var pool1 = ['red','blue','green','cake','star','apple'];
      type = pool1[Math.floor(Math.random() * pool1.length)];
    }
  }

  state.items.push({
    x: 60 + Math.random() * (W - 120),
    y: -40,
    r: 22,
    type: type,
    vy: cfg.fallSpeed * (0.85 + Math.random() * 0.3),
    rot: 0
  });
}

// ========== ОБНОВЛЕНИЕ ==========
function update(dt){
  if(state.clearItemsNextFrame){
    state.items.length = 0;
    state.clearItemsNextFrame = false;
  }

  if(state.pauseTimer > 0){
    state.pauseTimer -= dt;
    updateLion(dt, 1.0);
    updateHUD(false);
    return;
  }

  if(state.breatherTimer > 0){
    state.breatherTimer -= dt;
    if(state.breatherTimer <= 0){
      state.breatherTimer = 0;
      flash('Передышка окончена', '#ffaa00');
    }
  }

  var lifeScale = state.lives === 1 ? LOW_LIFE_SCALE : 1.0;
  var timeScale = BASE_TIME_SCALE * lifeScale;

  state.timeLeft -= dt * timeScale;
  if(state.timeLeft <= 0){
    state.timeLeft = 0;
    updateHUD(true);
    gameOver();
    return;
  }

  updateHUD(false);
  updateLion(dt, timeScale);

  state.spawnTimer -= dt;
  if(state.spawnTimer <= 0){
    spawnItem();
    var interval = state.cfg.spawnInterval;
    if(state.breatherTimer > 0) interval *= BREATHER_LOOSEN;
    state.spawnTimer = interval;
  }

  var snapshot = state.items.slice();
  for(var i = 0; i < snapshot.length; i++){
    var it = snapshot[i];
    if(state.items.indexOf(it) < 0) continue;

    it.y += it.vy * dt * timeScale;
    it.rot += dt * 2.5;

    var dx = it.x - lion.x;
    var dy = it.y - (lion.y + lion.h/2);
    var rad = it.r + lion.w/2 - 12;
    if(dx*dx + dy*dy < rad*rad){
      catchItem(it);
      if(!state.running) return;
      var idx = state.items.indexOf(it);
      if(idx >= 0) state.items.splice(idx, 1);
      continue;
    }
    if(it.y > H + 60){
      var idx2 = state.items.indexOf(it);
      if(idx2 >= 0) state.items.splice(idx2, 1);
    }
  }
}

function updateLion(dt, timeScale){
  var speed = 420;
  var ax = 0;
  if(keys['ArrowLeft'] || keys['a'] || keys['A']) ax -= 1;
  if(keys['ArrowRight']|| keys['d'] || keys['D']) ax += 1;

  if(usePointer && pointerX !== null && ax === 0){
    var diff = pointerX - lion.x;
    if(Math.abs(diff) > 6){
      ax = Math.sign(diff) * Math.min(1, Math.abs(diff) / 100);
    }
  }
  if(keys['ArrowLeft']||keys['ArrowRight']||keys['a']||keys['d']||keys['A']||keys['D']){
    usePointer = false;
  }

  lion.x += ax * speed * dt;
  lion.x = Math.max(lion.w/2, Math.min(W - lion.w/2, lion.x));

  lion.vy += GRAVITY * dt * timeScale;
  lion.y += lion.vy * dt * timeScale;

  var lionBottom = lion.y + lion.h;
  if(lionBottom >= trampoline.y && lion.vy > 0){
    var over = lion.x + lion.w/2 > trampoline.x &&
               lion.x - lion.w/2 < trampoline.x + trampoline.w;
    if(over){
      lion.y = trampoline.y - lion.h;
      lion.vy = lion.jumpPower;
      if(!lion.justBounced){ Sound.jump(); lion.justBounced = true; }
    } else if(lionBottom >= H - 10){
      lion.y = H - lion.h - 10;
      lion.vy = lion.jumpPower * 0.6;
      if(!lion.justBounced){ Sound.jump(); lion.justBounced = true; }
    }
  } else if(lion.vy < 0){
    lion.justBounced = false;
  }
}

// ========== ЛОВЛЯ ==========
function catchItem(it){
  var inBreather = state.breatherTimer > 0;

  // ❤️ Бонусная жизнь
  if(it.type === 'heart'){
    if(state.lives < MAX_LIVES){
      state.lives++;
      flash('❤️ +1 жизнь!', '#ff69b4');
      Sound.heart();
    } else {
      flash('❤️ уже максимум', '#ff69b4');
    }
    updateHUD(true);
    return;
  }

  // ⏰ Бонус времени
  if(it.type === 'clock'){
    state.timeLeft = Math.min(MAX_TIME, state.timeLeft + TIME_CLOCK_BONUS);
    flash('⏰ +' + TIME_CLOCK_BONUS + 'с', '#7CFC00');
    Sound.clock();
    updateHUD(true);
    return;
  }

  // 💣 Бомба
  if(it.type === 'bomb'){
    if(!inBreather){
      state.lives--;
      state.combo = 0;
      state.timeLeft = Math.max(1, state.timeLeft - TIME_PENALTY);
      flash('💣 −' + TIME_PENALTY + 'с  ❤️-1', '#ff5555');
    } else {
      flash('💣 (передышка)', '#ffaa00');
    }
    Sound.wrong();
    if(state.lives <= 0){ gameOver(); return; }
    updateHUD(true);
    return;
  }

  // Задание
  var taskItem = null;
  for(var i = 0; i < state.task.length; i++){
    if(state.task[i].type === it.type){ taskItem = state.task[i]; break; }
  }

  if(taskItem && state.collected[it.type] < taskItem.n){
    state.collected[it.type]++;
    Sound.collect();
    updateHUD(true);
    var allDone = true;
    for(var j = 0; j < state.task.length; j++){
      var t = state.task[j];
      if((state.collected[t.type] || 0) < t.n){ allDone = false; break; }
    }
    if(allDone) completeTask();
  } else {
    if(!inBreather){
      state.lives--;
      state.combo = 0;
      state.timeLeft = Math.max(1, state.timeLeft - TIME_PENALTY);
      flash('❌ Лишний  −' + TIME_PENALTY + 'с  ❤️-1', '#ffaa00');
    } else {
      flash('❌ (передышка)', '#ffaa00');
    }
    Sound.wrong();
    if(state.lives <= 0){ gameOver(); return; }
    updateHUD(true);
  }
}

// ========== ЗАДАНИЕ ВЫПОЛНЕНО ==========
function completeTask(){
  state.combo++;
  state.tasksDone++;

  var bonus = TIME_BONUS_BASE + state.combo * TIME_BONUS_COMBO;
  state.timeLeft = Math.min(MAX_TIME, state.timeLeft + bonus);
  flash('✅ +' + bonus + 'с  (комбо ×' + state.combo + ')', '#7CFC00');
  Sound.win();
  showCombo();

  // Регенерация жизни каждые LIFE_REGEN_EVERY заданий
  if(state.tasksDone > 0 && state.tasksDone % LIFE_REGEN_EVERY === 0 && state.lives < MAX_LIVES){
    state.lives++;
    flash('❤️ +1 жизнь! (за задания)', '#ff69b4');
    Sound.regen();
  }

  if(state.taskNum > state.bestTasks){
    state.bestTasks = state.taskNum;
    localStorage.setItem('lion_bestTasks', state.bestTasks);
  }
  if(state.timeLeft > state.bestTime){
    state.bestTime = Math.floor(state.timeLeft);
    localStorage.setItem('lion_bestTime', state.bestTime);
  }

  state.taskNum++;
  buildTask(state.taskNum);
  state.pauseTimer = PAUSE_BETWEEN;
  state.clearItemsNextFrame = true;
}

// ========== ОТРИСОВКА ==========
function draw(dt){
  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#FFE4B5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  var t = performance.now() * 0.02;
  for(var i = 0; i < 5; i++){
    var x = ((i * 220 + t) % (W + 200)) - 100;
    var y = 60 + (i % 3) * 40;
    ctx.beginPath();
    ctx.arc(x, y, 32, 0, Math.PI*2);
    ctx.arc(x + 30, y + 8, 26, 0, Math.PI*2);
    ctx.arc(x - 30, y + 8, 24, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,230,100,0.9)';
  ctx.beginPath();
  ctx.arc(W - 90, 90, 45, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#c0392b';
  roundRect(trampoline.x, trampoline.y, trampoline.w, trampoline.h, 9);
  ctx.fill();
  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(trampoline.x + 12, trampoline.y + trampoline.h, 10, 40);
  ctx.fillRect(trampoline.x + trampoline.w - 22, trampoline.y + trampoline.h, 10, 40);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(trampoline.x + 8, trampoline.y + 3, trampoline.w - 16, 5, 3);
  ctx.fill();

  ctx.font = '40px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(var k = 0; k < state.items.length; k++){
    var it = state.items[k];
    if(!it) continue;
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(Math.sin(it.rot) * 0.35);
    // Подсветка сердца — чтобы его было видно
    if(it.type === 'heart'){
      ctx.shadowColor = '#ff69b4';
      ctx.shadowBlur = 18;
    }
    ctx.fillText(TYPES[it.type].e, 0, 0);
    ctx.restore();
  }

  var shadowScale = Math.max(0.3, 1 - (H - lion.y - lion.h) / 500);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(lion.x, trampoline.y + 2, 35 * shadowScale, 8 * shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.font = '70px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(lion.x, lion.y + lion.h/2);
  ctx.fillText('🦁', 0, 0);
  ctx.restore();

  if(state.pauseTimer > 0){
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, H/2 - 40, W, 80);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸ Готовься!', W/2, H/2);
  }

  if(state.breatherTimer > 0){
    ctx.strokeStyle = 'rgba(124,252,0,0.6)';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W-6, H-6);
  }

  var p = Math.max(0, Math.min(1, state.timeLeft / MAX_TIME));
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H - 10, W, 10);
  var color = state.timeLeft < 8 ? '#e74c3c' :
              state.timeLeft < 20 ? '#f39c12' : '#2ecc71';
  ctx.fillStyle = color;
  ctx.fillRect(0, H - 10, W * p, 10);

  drawFlashes(dt);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ========== ЦИКЛ ==========
function loop(t){
  if(!state.running) return;
  var dt = (t - state.lastTime) / 1000;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;
  state.lastTime = t;

  update(dt);

  if(state.running){
    draw(dt);
    state.rafId = requestAnimationFrame(loop);
  }
}

// ========== ИГРА ОКОНЧЕНА ==========
function gameOver(){
  state.running = false;
  if(state.rafId){ cancelAnimationFrame(state.rafId); state.rafId = 0; }
  Sound.fail();

  var sessionTasks = state.taskNum - 1;
  if(sessionTasks > state.bestSession){
    state.bestSession = sessionTasks;
    localStorage.setItem('lion_bestSession', state.bestSession);
  }

  var recordMsg =
    '🏆 Рекорды:\n' +
    'Заданий подряд: ' + state.bestTasks + '\n' +
    'Макс. время: ' + state.bestTime + 'с\n' +
    'Лучшая сессия: ' + state.bestSession + ' заданий\n\n' +
    'В этот раз:\n' +
    'Заданий: ' + sessionTasks + '\n' +
    'Осталось времени: ' + Math.floor(state.timeLeft) + 'с';

  showOverlay(recordMsg, 'Нажми, чтобы играть заново', true, function(){
    startGame();
  });
}

function showOverlay(text, hint, showReset, cb){
  msgEl.textContent = text;
  hintEl.textContent = hint;
  resetBtn.style.display = showReset ? 'inline-block' : 'none';
  overlay.classList.remove('hidden');
  overlay.onclick = function(e){
    if(e.target === resetBtn) return;
    overlay.classList.add('hidden');
    cb();
  };
  resetBtn.onclick = function(e){
    e.stopPropagation();
    localStorage.removeItem('lion_bestTasks');
    localStorage.removeItem('lion_bestTime');
    localStorage.removeItem('lion_bestSession');
    state.bestTasks = 0;
    state.bestTime = 0;
    state.bestSession = 0;
    flash('Рекорды сброшены', '#fff');
  };
}

// ========== СТАРТ ==========
overlay.onclick = function(){
  overlay.classList.add('hidden');
  startGame();
};

function fitCanvas(){
  var wrap = document.getElementById('wrap');
  var scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

})();
</script>
